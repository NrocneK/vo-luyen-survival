<!doctype html><html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>QA cơ chế sáu màn Trung Đô</title><style>body{margin:0;background:#10251f;color:#e8e5c9;font:12px system-ui}#audit-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;min-height:48px}#audit-tools button,#audit-tools select{padding:6px 9px;background:#244339;color:#e6e4c9;border:1px solid #6f8565;font:12px system-ui}#audit-game{position:relative;height:calc(100vh - 64px);isolation:isolate}#audit-status{padding-left:8px;color:#b8d6c3}#audit-hud{position:absolute;inset:0;pointer-events:none}#audit-hud button{pointer-events:auto}</style></head><body><div id="audit-tools"><strong>QA nội bộ</strong><select id="stage" aria-label="Màn kiểm tra"></select><button id="warning">Cảnh báo</button><button id="active">Diễn ra</button><button id="rune">Tụ linh</button><button id="storm">Hắc ấn</button><button id="counter">Phản công</button><button id="boss">Gặp boss</button><button id="live">Chạy / Dừng</button><span id="audit-status">Đang nạp</span></div><main id="audit-game"><div id="game-canvas" class="game-canvas"></div><div id="audit-hud"></div></main><script type="module" src="./stage-mechanics-audit.tsx"></script></body></html>
