<!doctype html><html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>QA Hồi Phong và Viêm Hoàn 1.5.1</title><style>body{margin:0;background:#10251f;color:#eee8d2;font:12px system-ui}#tools{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:8px 12px;min-height:54px}#tools button,#tools select{font:12px system-ui;color:#e7ecd8;background:#244339;border:1px solid #70917c;padding:6px 9px}#audit{position:relative;height:calc(100vh - 70px);isolation:isolate}#hud{position:absolute;inset:0;pointer-events:none}#hud button{pointer-events:auto}#report{color:#b6ded0;margin-left:6px;font-size:11px}</style></head><body><div id="tools"><strong>QA 1.5.1</strong><select id="skill" aria-label="Kỹ năng kiểm tra"><option value="nguyen-khi-tram">Hồi Phong Kiếm</option><option value="viem-hoan">Viêm Hoàn</option></select><select id="rank" aria-label="Bậc kỹ năng"><option value="1">Bậc 1</option><option value="2" selected>Bậc 2</option><option value="3">Bậc 3</option><option value="5">Bậc 5</option><option value="6">Bậc 6</option></select><select id="branch" aria-label="Nhánh Viêm Hoàn"><option value="">Cơ bản</option><option value="hoan-quang-vuc">Quảng Vực</option><option value="hoan-liet-diem">Liệt Diễm</option></select><button id="out">Chiều đi</button><button id="back">Chiều về</button><button id="early">Sóng đầu</button><button id="mid">Sóng giữa</button><button id="edge">Sóng tới biên</button><button id="step">Bước 0,1 giây</button><button id="play">Phát / Dừng</button><span id="report">Đang nạp</span></div><main id="audit"><div id="game-canvas" class="game-canvas"></div><div id="hud"></div></main><script type="module" src="./flame-return-audit.tsx"></script></body></html>
