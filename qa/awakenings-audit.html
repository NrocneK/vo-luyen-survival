<!doctype html>
<html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>QA Thức tỉnh 1.6.0</title>
<style>body{margin:0;background:#10251f;color:#eee8d2;font:12px system-ui}#tools{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:8px 12px;min-height:54px}#tools button,#tools select{font:12px system-ui;color:#e7ecd8;background:#244339;border:1px solid #70917c;padding:6px 9px}#audit{position:relative;height:calc(100vh - 70px);isolation:isolate}#audit-hud{position:absolute;inset:0;pointer-events:none}#audit-hud button,#audit-hud summary{pointer-events:auto}#audit-hud .modal-backdrop,#audit-hud .pause-backdrop{pointer-events:auto}#audit-status{color:#b6ded0;margin-left:6px;font-size:11px}</style></head>
<body><div id="tools"><strong>QA THỨC TỈNH</strong><select id="skill" aria-label="Kỹ năng kiểm tra"></select><select id="branch" aria-label="Biến chiêu kiểm tra"></select><button id="draft">Rút thẻ thức tỉnh</button><button id="missing">Thiếu hỗ trợ</button><button id="frame">Khung chiến đấu</button><button id="step">Bước 0,1 giây</button><button id="pause">Xem tiến độ</button><span id="audit-status">Đang nạp</span></div><main id="audit"><div id="game-canvas" class="game-canvas"></div><div id="audit-hud"></div></main><script type="module" src="./awakenings-audit.tsx"></script></body></html>
